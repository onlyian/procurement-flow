kind = "web"
previewPath = "/"
title = "ProcurementFlow"
version = "1.0.0"
id = "artifacts/procurement-flow"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19362

[services.development]
run = "pnpm --filter @workspace/procurement-flow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/procurement-flow", "run", "build" ]
publicDir = "artifacts/procurement-flow/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19362"
BASE_PATH = "/"
